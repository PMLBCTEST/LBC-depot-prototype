/* ==========================================================================
   Leboncoin - prototype dépôt d'annonce (workshop v2)
   Spark Foundation : thème Part, mode Light (tokens stables uniquement)
   Source : references/Foundation-spark-leboncoin.md
   ========================================================================== */

:root {
  /* Palette Part (extraits utilisés) */
  --clementine-50: #FFF2EB; --clementine-100: #FFE9DE; --clementine-400: #F07B42; --clementine-500: #EC5A13;
  --clementine-600: #B84A14; --clementine-700: #89380F;
  --plum-100: #E9D6FA; --plum-500: #8526D9; --plum-800: #360F57;
  --blueberry-50: #F4F9FE; --blueberry-100: #E6F2FD; --blueberry-200: #C2E0FA; --blueberry-700: #0C5291;
  --blueberry-800: #094171; --blueberry-900: #152233;
  --avocado-50: #F5FBF8; --avocado-100: #E0F2E9; --avocado-700: #1D6340;
  --cherry-50: #FBECEB; --cherry-100: #F7D7D4; --cherry-600: #AD291F; --cherry-700: #822017;
  --banana-100: #FFEECC; --banana-800: #664400;
  --nightshade-50: #F6F8F9; --nightshade-100: #F0F2F5; --nightshade-200: #E4E8ED; --nightshade-300: #D0D7DF;
  --nightshade-400: #ACB8C7; --nightshade-500: #6C819D; --nightshade-600: #4F6076; --nightshade-700: #3A4757;
  --nightshade-800: #2B3441; --nightshade-900: #202730;

  /* Tokens sémantiques Part / Light */
  --main: var(--clementine-500);          --on-main: #fff;
  --main-hover: var(--clementine-400);    --main-pressed: var(--clementine-600);
  --main-container: var(--clementine-100); --on-main-container: var(--clementine-700);
  --support: var(--blueberry-800);        --on-support: #fff;
  --support-hover: var(--blueberry-700);
  --support-container: var(--blueberry-100); --on-support-container: var(--blueberry-900);
  --accent: var(--plum-500);              --on-accent: #fff;
  --accent-container: var(--plum-100);    --on-accent-container: var(--plum-800);
  --success: var(--avocado-700);          --success-container: var(--avocado-100);
  --alert-container: var(--banana-100);   --on-alert-container: var(--banana-800);
  --error: var(--cherry-600);             --error-container: var(--cherry-100); --on-error-container: var(--cherry-700);
  --info: var(--blueberry-700);           --info-container: var(--blueberry-200);
  --neutral: var(--nightshade-700);       --neutral-container: var(--nightshade-100);
  --background: #fff;                     --on-background: var(--blueberry-900);
  --background-variant: var(--blueberry-50);
  --surface: #fff;                        --on-surface: var(--blueberry-900);
  --surface-hover: var(--nightshade-50);
  --surface-inverse: var(--nightshade-800); --on-surface-inverse: #fff;
  --outline: var(--nightshade-400);       --outline-high: var(--nightshade-900);
  --overlay: rgba(32, 39, 48, .72);       --on-overlay: #fff;
  --shadow: rgba(108, 129, 157, .5);
  --focus: #0000FF;
  /* Alias texte secondaire / disabled (Nightshade, contraste AA) */
  --text-dim: var(--nightshade-600);
  --disabled-bg: var(--nightshade-200);   --disabled-text: var(--nightshade-500);

  /* Espacements */
  --sp-sm: 4px; --sp-md: 8px; --sp-lg: 16px; --sp-xl: 24px; --sp-2xl: 32px; --sp-3xl: 40px; --sp-4xl: 48px;
  /* Rayons */
  --rounded-sm: 4px; --rounded-md: 8px; --rounded-lg: 16px; --rounded-xl: 24px; --rounded-full: 9999px;
  /* Bordures */
  --border-sm: 1px; --border-md: 2px;
  /* Ombres */
  --shadow-sm: 0 4px 8px 0 var(--shadow);
  --shadow-lg: 0 8px 16px 0 var(--shadow);
  /* Motion */
  --dur-fast: 150ms; --dur: 250ms; --dur-slow: 400ms;
  --ease-standard: cubic-bezier(.2, 0, 0, 1);
  --ease-decelerate: cubic-bezier(.05, .7, .1, 1);
  --ease-accelerate: cubic-bezier(.3, 0, .8, .15);

  --font: "Nunito Sans", -apple-system, "SF Pro Rounded", "SF Pro Display", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); color: var(--on-background); background: var(--nightshade-100);
  font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center; gap: var(--sp-3xl); padding: var(--sp-xl);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { display: block; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: var(--border-md) solid var(--focus); outline-offset: 2px; }

/* Styles typographiques Spark (Part) */
.t-headline1 { font-size: 20px; line-height: 28px; font-weight: 700; }
.t-headline2 { font-size: 18px; line-height: 24px; font-weight: 700; }
.t-subhead   { font-size: 16px; line-height: 24px; font-weight: 700; }
.t-body1     { font-size: 16px; line-height: 24px; font-weight: 400; }
.t-body1h    { font-size: 16px; line-height: 24px; font-weight: 700; }
.t-body2     { font-size: 14px; line-height: 20px; font-weight: 400; }
.t-body2h    { font-size: 14px; line-height: 20px; font-weight: 700; }
.t-caption   { font-size: 12px; line-height: 16px; font-weight: 400; }
.t-captionh  { font-size: 12px; line-height: 16px; font-weight: 700; }
.dim { color: var(--text-dim); }

/* Icônes */
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 32px; height: 32px; }
.ic.fill { fill: currentColor; stroke: none; }

/* Panneau parcours (hors maquette) */
.guide { width: 280px; align-self: flex-start; margin-top: var(--sp-2xl); }
.guide h2 { margin-bottom: var(--sp-lg); }
.guide ol { list-style: none; margin: 0 0 var(--sp-xl); padding: 0; display: flex; flex-direction: column; gap: var(--sp-md); }
.guide li button { width: 100%; text-align: left; padding: var(--sp-md) var(--sp-lg); border-radius: var(--rounded-lg);
  background: var(--surface); border: var(--border-sm) solid var(--nightshade-300); display: flex; gap: var(--sp-md); align-items: center; }
.guide li button:hover { background: var(--surface-hover); }
.guide li button[aria-current="step"] { border: var(--border-md) solid var(--main); background: var(--main-container); color: var(--on-main-container); }
.guide .n { width: 24px; height: 24px; border-radius: var(--rounded-full); background: var(--neutral-container); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.guide li button[aria-current="step"] .n { background: var(--main); color: var(--on-main); }

/* Téléphone */
.phone { position: relative; width: 375px; height: min(812px, calc(100vh - 48px)); background: var(--background); border-radius: 40px;
  border: 8px solid var(--nightshade-900); overflow: hidden; box-shadow: var(--shadow-lg); flex: none; }
#app { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--background); animation: in var(--dur-slow) var(--ease-decelerate); }
@keyframes in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 var(--sp-lg) var(--sp-xl); scroll-behavior: smooth; }
.scroll.nopad { padding: 0 0 var(--sp-xl); }

/* Header (navbar iOS) */
.navbar { height: 56px; padding: 0 var(--sp-md); display: flex; align-items: center; gap: var(--sp-md); flex: none; margin-top: var(--sp-xl); }
.navbar h1 { flex: 1; text-align: center; font-size: 16px; line-height: 24px; font-weight: 700; }
.navbar .sp { width: 40px; flex: none; }

/* Boutons */
.btn { min-height: 48px; padding: 0 var(--sp-xl); border-radius: var(--rounded-full); font-size: 16px; line-height: 24px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-md);
  transition: background var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }
.btn:active { transform: scale(.98); }
.btn.main { background: var(--main); color: var(--on-main); }
.btn.main:hover { background: var(--main-hover); }
.btn.main:active { background: var(--main-pressed); }
.btn.outlined { border: var(--border-md) solid var(--support); color: var(--support); background: transparent; }
.btn.outlined:hover { background: var(--support-container); }
.btn.tinted { background: var(--neutral-container); color: var(--neutral); }
.btn.tinted:hover { background: var(--nightshade-200); }
.btn.ghost { color: var(--support); padding: 0 var(--sp-lg); }
.btn.ghost:hover { background: var(--support-container); }
.btn.sm { min-height: 40px; padding: 0 var(--sp-lg); font-size: 14px; line-height: 20px; }
.btn.block { width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--disabled-bg); color: var(--disabled-text); border-color: transparent; cursor: not-allowed; transform: none; }
.ibtn { width: 40px; height: 40px; border-radius: var(--rounded-full); display: grid; place-items: center; flex: none; color: var(--on-surface); }
.ibtn:hover { background: var(--surface-hover); }
.ibtn.tinted { background: var(--neutral-container); }
.ibtn.main { background: var(--main); color: var(--on-main); }
.ibtn.recording { background: var(--error); color: #fff; animation: ping 1.2s var(--ease-standard) infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(173, 41, 31, .5); } 100% { box-shadow: 0 0 0 16px rgba(173, 41, 31, 0); } }
.textlink { color: var(--support); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.textlink:hover { color: var(--support-hover); }

/* Sticky bottom */
.sticky { flex: none; padding: var(--sp-lg); background: var(--surface); border-top: var(--border-sm) solid var(--nightshade-200); display: flex; flex-direction: column; gap: var(--sp-md); }

/* Tabbar (iOS / Android, 5 items) */
.tabbar { flex: none; height: 80px; border-top: var(--border-sm) solid var(--nightshade-200); display: grid; grid-template-columns: repeat(5, 1fr); padding: var(--sp-md) 0 var(--sp-lg); background: var(--surface); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-sm); color: var(--text-dim); font-size: 12px; line-height: 16px; }
.tabbar button[aria-current="page"], .tabbar button.publish { color: var(--main); font-weight: 700; }

/* Tags, chips, badges */
.tag { display: inline-flex; align-items: center; gap: var(--sp-sm); padding: 0 var(--sp-md); border-radius: var(--rounded-sm); font-size: 12px; line-height: 20px; font-weight: 700; white-space: nowrap; }
.tag.support { background: var(--support-container); color: var(--on-support-container); }
.tag.alert { background: var(--alert-container); color: var(--on-alert-container); }
.tag.neutral { background: var(--neutral-container); color: var(--neutral); }
.tag.success { background: var(--success-container); color: var(--success); }
.tag.accent { background: var(--accent-container); color: var(--on-accent-container); }
.tag.error { background: var(--error-container); color: var(--on-error-container); }
.chip { min-height: 32px; padding: 0 var(--sp-lg); border-radius: var(--rounded-xl); border: var(--border-sm) solid var(--outline); background: var(--surface);
  display: inline-flex; align-items: center; gap: var(--sp-sm); font-size: 14px; line-height: 20px; white-space: nowrap; color: var(--on-surface);
  transition: background var(--dur) var(--ease-standard), border-color var(--dur) var(--ease-standard); }
.chip .ic { width: 16px; height: 16px; }
.chip.checked { background: var(--success-container); border-color: var(--success); color: var(--success); font-weight: 700; }
.chip .tick { display: none; }
.chip.checked .tick { display: block; }
.chip.checked .dot { display: none; }
.chip .dot { width: 8px; height: 8px; border-radius: var(--rounded-full); background: var(--outline); }
.chip.select { cursor: pointer; }
.chip.select[aria-pressed="true"] { background: var(--on-surface); color: #fff; border-color: var(--on-surface); }
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-md); }

/* Cards, bannières */
.card { background: var(--surface); border: var(--border-sm) solid var(--nightshade-300); border-radius: var(--rounded-lg); padding: var(--sp-lg); }
.card.int { width: 100%; text-align: left; display: flex; gap: var(--sp-lg); align-items: center; }
.card.int:hover { background: var(--surface-hover); }
.banner { display: flex; gap: var(--sp-md); align-items: flex-start; padding: var(--sp-lg); border-radius: var(--rounded-lg); background: var(--info-container); color: var(--on-support-container); }
.banner.accent { background: var(--accent-container); color: var(--on-accent-container); }
.banner .ic { margin-top: 0; }

/* Form fields */
.field { display: flex; flex-direction: column; gap: var(--sp-sm); }
.field + .field { margin-top: var(--sp-xl); }
.field label, .field .lbl { font-size: 14px; line-height: 20px; font-weight: 700; }
.field .desc, .field .helper { font-size: 12px; line-height: 16px; color: var(--text-dim); }
.input, .textarea { width: 100%; min-height: 48px; padding: 0 var(--sp-lg); border: var(--border-sm) solid var(--outline); border-radius: var(--rounded-xl); background: var(--surface); font-size: 16px; line-height: 24px; }
.input:hover, .textarea:hover { border-color: var(--outline-high); }
.input:focus, .textarea:focus { outline: var(--border-md) solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.textarea { padding: var(--sp-lg); min-height: 112px; resize: none; display: block; }
.field.invalid .input, .field.invalid .textarea { border: var(--border-md) solid var(--error); }
.field.invalid .err { display: block; }
.err { display: none; color: var(--error); font-size: 12px; line-height: 16px; font-weight: 700; }
.input-wrap { position: relative; }
.input-wrap .suffix { position: absolute; right: var(--sp-lg); top: 50%; transform: translateY(-50%); color: var(--text-dim); font-weight: 700; }
.input-wrap .input { padding-right: var(--sp-3xl); }
.section { margin-top: var(--sp-2xl); }
.section > h2 { margin-bottom: var(--sp-lg); }
.section > h3 { margin: var(--sp-xl) 0 var(--sp-md); }

/* Magic field */
.magic { border: var(--border-sm) solid var(--outline); border-radius: var(--rounded-xl); background: var(--surface); overflow: hidden; }
.magic:focus-within { outline: var(--border-md) solid var(--focus); border-color: var(--focus); }
.magic textarea { width: 100%; border: 0; padding: var(--sp-lg); min-height: 120px; resize: none; display: block; font-size: 16px; line-height: 24px; background: transparent; }
.magic textarea:focus { outline: none; }
.magic .bar { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-sm) var(--sp-md) var(--sp-md) var(--sp-lg); }
.listening { display: flex; align-items: center; gap: var(--sp-md); color: var(--error); font-weight: 700; font-size: 14px; }
.wave { display: inline-flex; gap: 3px; align-items: center; height: 16px; }
.wave i { width: 3px; background: var(--error); border-radius: 2px; animation: wave 800ms var(--ease-standard) infinite alternate; }
.wave i:nth-child(2) { animation-delay: 120ms; } .wave i:nth-child(3) { animation-delay: 240ms; } .wave i:nth-child(4) { animation-delay: 360ms; }
@keyframes wave { from { height: 4px; } to { height: 16px; } }

/* Photos */
.thumbs { display: flex; gap: var(--sp-md); overflow-x: auto; padding: var(--sp-sm) 0; }
.thumb { position: relative; width: 72px; height: 72px; border-radius: var(--rounded-md); overflow: hidden; flex: none; background: var(--neutral-container); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .rm { position: absolute; top: var(--sp-sm); right: var(--sp-sm); width: 24px; height: 24px; border-radius: var(--rounded-full); background: var(--overlay); color: var(--on-overlay); display: grid; place-items: center; }
.thumb .rm .ic { width: 16px; height: 16px; }
.addtile { width: 72px; height: 72px; border-radius: var(--rounded-md); border: var(--border-md) dashed var(--outline); display: grid; place-items: center; color: var(--support); flex: none; }
.addtile:hover { background: var(--support-container); }

/* Galerie */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-sm); }
.tile { position: relative; aspect-ratio: 1; border-radius: var(--rounded-md); overflow: hidden; background: var(--neutral-container); }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile.sel { outline: var(--border-md) solid var(--main); outline-offset: -2px; }
.tile.sel::after { content: ""; position: absolute; inset: 0; background: rgba(236, 90, 19, .16); }
.tile .num { position: absolute; top: var(--sp-sm); right: var(--sp-sm); width: 24px; height: 24px; border-radius: var(--rounded-full); background: var(--main); color: var(--on-main); font-size: 12px; font-weight: 700; display: grid; place-items: center; z-index: 1; }
.tile .ring { position: absolute; top: var(--sp-sm); right: var(--sp-sm); width: 24px; height: 24px; border-radius: var(--rounded-full); border: var(--border-md) solid #fff; background: rgba(32, 39, 48, .24); }
.tile.cam { background: var(--neutral-container); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-sm); color: var(--support); font-weight: 700; font-size: 12px; line-height: 16px; }

/* Liste de paramètres */
.rows { border: var(--border-sm) solid var(--nightshade-300); border-radius: var(--rounded-lg); overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: var(--sp-md); padding: var(--sp-lg); text-align: left; background: var(--surface); }
.row + .row { border-top: var(--border-sm) solid var(--nightshade-200); }
.row:hover { background: var(--surface-hover); }
.row .k { flex: 1; min-width: 0; }
.row .v { font-weight: 700; }
.row.invalid { background: var(--error-container); }
.row.invalid .k .t-caption { color: var(--on-error-container); }

/* Switch, radio, checkbox */
.switch { position: relative; width: 52px; height: 32px; border-radius: var(--rounded-full); background: var(--nightshade-400); flex: none; transition: background var(--dur-fast) var(--ease-standard); }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: var(--rounded-full); background: #fff; transition: transform var(--dur-fast) var(--ease-standard); }
.switch[aria-checked="true"] { background: var(--support); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.opt { width: 100%; display: flex; align-items: center; gap: var(--sp-lg); padding: var(--sp-lg) 0; text-align: left; }
.opt + .opt { border-top: var(--border-sm) solid var(--nightshade-200); }
.opt .grow { flex: 1; min-width: 0; }
.radio, .check { width: 24px; height: 24px; border: var(--border-md) solid var(--outline-high); flex: none; display: grid; place-items: center; background: var(--surface); }
.radio { border-radius: var(--rounded-full); }
.check { border-radius: var(--rounded-sm); }
.radio::after { content: ""; width: 12px; height: 12px; border-radius: var(--rounded-full); background: var(--on-support); transform: scale(0); transition: transform var(--dur-fast) var(--ease-standard); }
.check .ic { width: 16px; height: 16px; color: var(--on-support); stroke-width: 3; opacity: 0; }
[aria-checked="true"] > .radio, [aria-checked="true"] > .check { background: var(--support); border-color: var(--support); }
[aria-checked="true"] > .radio::after { transform: scale(1); }
[aria-checked="true"] > .check .ic { opacity: 1; }

/* Bottom sheet + overlay */
.overlay { position: absolute; inset: 0; background: var(--overlay); z-index: 20; opacity: 0; transition: opacity var(--dur) var(--ease-standard); }
.overlay.open { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; z-index: 21; background: var(--surface); border-radius: var(--rounded-xl) var(--rounded-xl) 0 0;
  display: flex; flex-direction: column; transform: translateY(100%); transition: transform var(--dur) var(--ease-decelerate); }
.sheet.open { transform: none; }
.sheet .grab { width: 40px; height: 4px; border-radius: var(--rounded-full); background: var(--nightshade-300); margin: var(--sp-md) auto 0; flex: none; }
.sheet .hd { padding: var(--sp-lg) var(--sp-lg) var(--sp-md); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md); flex: none; }
.sheet .bd { padding: 0 var(--sp-lg) var(--sp-lg); overflow-y: auto; }
.sheet .ft { padding: var(--sp-lg); border-top: var(--border-sm) solid var(--nightshade-200); display: flex; flex-direction: column; gap: var(--sp-md); flex: none; }

/* Toast / Snackbar */
.toast { position: absolute; left: var(--sp-lg); right: var(--sp-lg); bottom: 104px; z-index: 40; padding: var(--sp-lg); border-radius: var(--rounded-md); background: var(--surface-inverse); color: var(--on-surface-inverse);
  display: flex; gap: var(--sp-md); align-items: center; box-shadow: var(--shadow-sm); animation: up var(--dur) var(--ease-decelerate); }
.toast.error { background: var(--error); color: #fff; }
.toast.success { background: var(--success); color: #fff; }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* Loading, skeleton, spinner, progress */
.spinner { width: 28px; height: 28px; border-radius: var(--rounded-full); border: 3px solid var(--nightshade-200); border-top-color: var(--main); animation: spin 800ms linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-lg); padding: var(--sp-2xl); text-align: center; }

/* Segments d'annonces (multi) */
.adstrip { display: flex; gap: var(--sp-md); overflow-x: auto; padding: var(--sp-md) var(--sp-lg); flex: none; border-bottom: var(--border-sm) solid var(--nightshade-200); }
.adchip { display: flex; align-items: center; gap: var(--sp-md); padding: var(--sp-sm) var(--sp-lg) var(--sp-sm) var(--sp-sm); border-radius: var(--rounded-xl); border: var(--border-sm) solid var(--outline); flex: none; background: var(--surface); }

/* Détection */
.group + .group { margin-top: var(--sp-xl); }

/* Carte (map) */
.map { position: relative; height: 192px; border-radius: var(--rounded-lg); overflow: hidden; background: var(--blueberry-50); border: var(--border-sm) solid var(--nightshade-300); }

/* Caméra */
.camera { background: var(--nightshade-900); color: #fff; }
.viewfinder { flex: 1; margin: 0 var(--sp-lg); border-radius: var(--rounded-lg); background: radial-gradient(circle at 50% 40%, var(--nightshade-700), var(--nightshade-900)); position: relative; display: grid; place-items: center; color: var(--nightshade-300); text-align: center; padding: var(--sp-xl); }

.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 30; }
.flash.go { animation: flash var(--dur) var(--ease-standard); }
@keyframes flash { 0% { opacity: .8; } 100% { opacity: 0; } }

/* Home */
.adgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-lg) var(--sp-md); }
.ad .ph { aspect-ratio: 1; border-radius: var(--rounded-md); background: var(--neutral-container); overflow: hidden; }
.ad .ph img { width: 100%; height: 100%; object-fit: cover; }
.search { display: flex; align-items: center; gap: var(--sp-md); padding: 0 var(--sp-lg); min-height: 48px; border-radius: var(--rounded-xl); border: var(--border-sm) solid var(--outline); color: var(--text-dim); margin: 0 var(--sp-lg); }

/* Confirmation */
.success-mark { width: 96px; height: 96px; border-radius: var(--rounded-full); background: var(--success-container); color: var(--success); display: grid; place-items: center; animation: pop var(--dur-slow) var(--ease-decelerate-back, cubic-bezier(.45, 1.45, .8, 1)); }

@media (max-width: 760px) {

}

}

/* Sticky bottom : apparition à la première sélection */
.sticky.enter { animation: sticky-in var(--dur) var(--ease-decelerate); }

/* Puce qui passe à l'état checked en temps réel */

@keyframes tick-in { from { transform: scale(0); } to { transform: scale(1); } }

/* Spark Chip : design Tinted, intent Support, taille Medium (Figma 7191:10751), addon trailing = icône edit */
.spark-chips { display: flex; flex-wrap: wrap; gap: var(--sp-md); }
.spark-chip { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-md); height: 32px; min-width: 32px; padding: 6px 12px;
  border-radius: var(--rounded-full); background: var(--support); color: var(--on-support); font-size: 16px; line-height: 24px; font-weight: 400; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }

#params h3 { margin: var(--sp-xl) 0 var(--sp-md); }
#params h3:first-child { margin-top: var(--sp-lg); }

/* Prix : segmented control Je vends / Je donne */
.seg { display: flex; padding: var(--sp-sm); border-radius: var(--rounded-full); background: var(--neutral-container); }
.seg button { flex: 1; min-height: 40px; border-radius: var(--rounded-full); font-weight: 700; color: var(--neutral); transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.seg button[aria-checked="true"] { background: var(--support); color: var(--on-support); }
/* Champ prix qui ouvre la modale */
.pricebtn { display: flex; align-items: center; justify-content: space-between; text-align: left; cursor: pointer; font-weight: 700; }
.pricebtn .ph { font-weight: 400; color: var(--text-dim); }
.pricebtn:disabled { background: var(--neutral-container); color: var(--disabled-text); cursor: not-allowed; border-color: transparent; }
/* Modale prix (plein écran) */
.fullmodal { position: absolute; inset: 0; z-index: 22; background: var(--background); display: flex; flex-direction: column; transform: translateY(100%); transition: transform var(--dur-slow) var(--ease-decelerate); }
.fullmodal.open { transform: none; }
.input.big { font-size: 20px; line-height: 28px; font-weight: 700; min-height: 56px; }
.recos { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-md); }
.reco { display: flex; flex-direction: column; gap: var(--sp-sm); align-items: flex-start; padding: var(--sp-md) var(--sp-md) var(--sp-md) var(--sp-lg); border-radius: var(--rounded-lg); border: var(--border-sm) solid var(--nightshade-300); background: var(--surface); text-align: left; }
.reco:hover { background: var(--surface-hover); }
.reco[aria-pressed="true"] { border: var(--border-md) solid var(--support); padding: 7px 7px 7px 15px; background: var(--support-container); }
.soldgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-lg) var(--sp-md); }
.soldgrid .ph { aspect-ratio: 1; border-radius: var(--rounded-md); overflow: hidden; background: var(--neutral-container); }
.soldgrid .ph img { width: 100%; height: 100%; object-fit: cover; }
#pm-err-price, #pm-err-min { display: none; }

/* Prix : champ pilule avec addon € (rendu figma-depot-prototype #jauge) */
.plabel { font-weight: 700; display: inline-flex; gap: var(--sp-sm); align-items: center; font-size: 14px; line-height: 20px; }
.preq { font-weight: 400; font-size: 12px; line-height: 16px; color: var(--text-dim); }
.field.tight { gap: var(--sp-sm); margin-top: 0; }
.price-input { display: flex; align-items: center; justify-content: space-between; border-radius: var(--rounded-full); padding: 0 0 0 var(--sp-lg); overflow: hidden; text-align: left; font-weight: 400; cursor: pointer; }
.price-input .ph { color: var(--text-dim); }
.price-input .addon { height: 46px; display: flex; align-items: center; padding: 0 var(--sp-lg); border-left: var(--border-sm) solid var(--outline); font-weight: 700; }
.price-input:disabled { background: var(--neutral-container); color: var(--disabled-text); cursor: not-allowed; border-color: transparent; }
/* Jauge de prix (percentiles : attractif < p10, optimal p10 à p90, élevé > p90) */
.gauge { width: 100%; }
.g-content { display: flex; flex-direction: column; gap: var(--sp-lg); }
.g-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; line-height: 20px; color: var(--neutral); min-height: 20px; }
.g-slot { display: flex; align-items: center; width: 100px; }
.g-left { justify-content: flex-start; } .g-center { justify-content: center; } .g-right { justify-content: flex-end; }
.g-slot .tag { display: none; } .g-slot.on .tag { display: inline-flex; } .g-slot.on .g-text { display: none; }
.tag-g-low { background: var(--success-container); color: var(--success); }
.tag-g-opt { background: var(--info-container); color: var(--info); }
.tag-g-high { background: var(--error-container); color: var(--on-error-container); }
.g-track { position: relative; display: flex; gap: var(--sp-md); height: 6px; align-items: flex-start; }
.g-seg { box-sizing: border-box; height: 8px; border-radius: var(--rounded-full); flex: 1; background: var(--surface); border: var(--border-sm) solid var(--outline); transition: background var(--dur) var(--ease-standard), border-color var(--dur) var(--ease-standard); }
.g-seg.on[data-zone="low"] { background: var(--success); border-color: var(--success); }
.g-seg.on[data-zone="opt"] { background: var(--info); border-color: var(--info); }
.g-seg.on[data-zone="high"] { background: var(--error); border-color: var(--error); }
.g-handle { position: absolute; top: -4px; left: calc((100% - 16px) / 3 * (var(--i) + var(--t)) + 8px * var(--i)); width: 16px; height: 16px; border-radius: var(--rounded-full); transform: translateX(-50%); display: flex; align-items: center; justify-content: center; background: var(--hc); }
.g-handle::after { content: ""; width: 8px; height: 8px; border-radius: var(--rounded-full); background: var(--surface); }
.g-handle[data-zone="low"] { --hc: var(--success); } .g-handle[data-zone="opt"] { --hc: var(--info); } .g-handle[data-zone="high"] { --hc: var(--error); }
.g-range { display: flex; justify-content: space-between; font-size: 14px; line-height: 20px; color: var(--neutral); }
.g-awareness { display: flex; gap: var(--sp-lg); align-items: flex-start; margin-top: var(--sp-lg); padding: var(--sp-lg); border-radius: var(--rounded-lg); background: var(--alert-container); color: var(--on-alert-container); }
.g-awareness img { flex: none; } .g-awareness p { flex: 1; font-weight: 700; }
.reco-link { display: flex; gap: var(--sp-md); align-items: center; width: 100%; margin-top: var(--sp-lg); text-align: left; border-radius: var(--rounded-md); }
.reco-link:hover span { text-decoration: underline; }

/* Chips de sélection (taille, poids, délai) : état sélectionné = Support, comme le Chip Spark */
.chip.select[aria-checked="true"] { background: var(--support); border-color: var(--support); color: var(--on-support); }
.chip.select[aria-checked="false"]:hover { background: var(--surface-hover); }
.lbl { font-size: 14px; line-height: 20px; font-weight: 700; }
/* Champ Adresse et livraison */
.deliv-btn { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md); text-align: left; padding: var(--sp-md) var(--sp-lg); min-height: 48px; cursor: pointer; }
.deliv-btn .dv { display: flex; flex-direction: column; gap: var(--sp-sm); min-width: 0; }

/* Switch : l'état est porté par le parent role="switch" (aria-checked) */
[aria-checked="true"] > .switch { background: var(--support); }
[aria-checked="true"] > .switch::after { transform: translateX(20px); }

/* Séparateurs de sections du One form : bandeau 8 px, gris clair (Neutral Container), pleine largeur */
.sec-div { height: 8px; background: var(--neutral-container); margin: var(--sp-xl) calc(var(--sp-lg) * -1) 0; }
.sec-div + .section { margin-top: var(--sp-xl); }

/* Champ prix éditable au clavier (page One form) */
.price-input { cursor: text; }
.price-input input { flex: 1; min-width: 0; height: 46px; padding: 0; border: 0; outline: 0; background: none; font: inherit; color: inherit; }
.price-input input::placeholder { color: var(--text-dim); }
.price-input input:disabled { color: var(--disabled-text); }
.price-input:focus-within { outline: var(--border-md) solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.price-input:has(input:disabled) { background: var(--neutral-container); border-color: transparent; cursor: not-allowed; }
#pm-err-min { display: none; }

/* Checklist guide du champ libre (statique, pas de détection en temps réel) */
.checklist-wrap { display: flex; flex-direction: column; gap: var(--sp-md); }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-md); }
.checklist li { display: flex; align-items: center; gap: var(--sp-md); }
.checklist .ic { width: 20px; height: 20px; padding: 3px; border-radius: var(--rounded-full); background: var(--support-container); color: var(--support); stroke-width: 3; }

/* Spark Chip : design Tinted, intent Support, état Enabled (Figma 390:5270), non interactif ici */

.spark-chip.tinted:hover { background: var(--support-container); }
.spark-chip.tinted:active { transform: none; }

/* Bottom sheet champ libre : 24 px entre titre, chips et champ libre */
.sheet .bd > .magic-field { margin-top: var(--sp-lg); gap: var(--sp-xl); }

/* Spark Chip : design Dashed, intent Neutral (Figma 7191:10879) : fond Neutral Container, bordure pointillée 1 px Neutral */
.spark-chip.dashed { background: var(--neutral-container); color: var(--neutral); border: var(--border-sm) dashed var(--neutral); cursor: default; }
.spark-chip.dashed:hover { background: var(--neutral-container); }
.spark-chip.dashed:active { transform: none; }

/* Commande vocale : bouton centré sous le champ libre, waveform On Main Container */
.voice { display: flex; flex-direction: column; align-items: center; gap: var(--sp-md); }
.voice-state { display: flex; flex-direction: column; align-items: center; gap: var(--sp-sm); min-height: 44px; justify-content: flex-start; }
.ibtn.mic { width: 56px; height: 56px; }
.ibtn.mic .ic { width: 24px; height: 24px; }
.ibtn.recording { background: var(--on-main-container); color: #fff; animation: ping-support 1.2s var(--ease-standard) infinite; }
@keyframes ping-support { 0% { box-shadow: 0 0 0 0 rgba(137, 56, 15, .45); } 100% { box-shadow: 0 0 0 16px rgba(137, 56, 15, 0); } }
.listening { color: var(--on-main-container); font-weight: 700; font-size: 14px; line-height: 20px; }
.wave.lg { height: 24px; gap: 4px; }
.wave.lg i { width: 4px; background: var(--on-main-container); border-radius: var(--rounded-sm); animation: wave-lg 800ms var(--ease-standard) infinite alternate; }
.wave.lg i:nth-child(1) { animation-delay: 0ms; } .wave.lg i:nth-child(2) { animation-delay: 110ms; } .wave.lg i:nth-child(3) { animation-delay: 220ms; }
.wave.lg i:nth-child(4) { animation-delay: 330ms; } .wave.lg i:nth-child(5) { animation-delay: 220ms; } .wave.lg i:nth-child(6) { animation-delay: 110ms; } .wave.lg i:nth-child(7) { animation-delay: 0ms; }
@keyframes wave-lg { from { height: 4px; } to { height: 24px; } }

/* Commande vocale : waveforms à gauche et à droite du bouton, sur le même axe, sans libellé */
.voice { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sp-lg); }
.voice .wl { justify-self: end; } .voice .wr { justify-self: start; }
.voice .wave { visibility: hidden; }
.voice.rec .wave { visibility: visible; }

/* Champ libre : hauteur par défaut 160 px (120 + 40) */
.magic textarea { min-height: 160px; }

/* Choix de la verticale : cartes sélectionnables (Card interactive, radio) */
.verticals { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-md); margin-bottom: var(--sp-xl); }
.vcard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-md); min-height: 96px; padding: var(--sp-lg) var(--sp-md);
  border: var(--border-sm) solid var(--nightshade-300); border-radius: var(--rounded-lg); background: var(--surface); color: var(--on-surface); text-align: center;
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard); }
.vcard:hover { background: var(--surface-hover); }
.vcard .ic { color: var(--support); }
.vcard[aria-checked="true"] { border: var(--border-md) solid var(--support); background: var(--support-container); padding: 15px 7px; }

/* Carte prix du One form (Figma One-Click 8493:20436) */
.price-card { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 64px; padding: 0 var(--sp-xl) 0 var(--sp-lg);
  border-radius: var(--rounded-md); background: var(--neutral-container); text-align: left; cursor: pointer; transition: background var(--dur-fast) var(--ease-standard); }
.price-card:hover { background: var(--nightshade-200); }
.pc-left { display: flex; align-items: center; gap: var(--sp-xl); height: 100%; }
.pc-value { font-size: 32px; line-height: 44px; font-weight: 700; color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-value.empty { color: var(--text-dim); }
.pc-divider { width: 64px; height: 1px; transform: rotate(90deg); margin: 0 -32px; flex: none; }
.pc-link { font-size: 14px; line-height: 20px; font-weight: 700; color: var(--neutral); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.price-field.invalid .price-card { outline: var(--border-md) solid var(--error); outline-offset: -2px; }
/* Ligne « Prix recommandé » dans la bottom sheet (texte, plus de bouton) */
.reco-line { margin-top: var(--sp-lg); }
#pm-err-price { display: none; }

/* Section prix (Figma One-Click 8494:21374) : bloc Neutral Container, label + montant centré « • Modifier » */
.price-section { display: flex; flex-direction: column; gap: var(--sp-xl); padding: var(--sp-lg); border-radius: var(--rounded-lg); background: var(--neutral-container); }
.price-section .ps-label { display: flex; align-items: flex-end; gap: var(--sp-sm); margin: 0; }
.price-section .ps-label .preq { padding-bottom: 1px; }
.ps-row { display: flex; align-items: center; justify-content: center; gap: var(--sp-md); width: 100%; height: 64px; padding: 0 var(--sp-xl) 0 var(--sp-lg); border-radius: var(--rounded-md); cursor: pointer; }
.ps-row:hover .pc-link { color: var(--on-surface); }
.ps-dot { font-size: 10px; line-height: 14px; color: var(--neutral); }
.price-section.invalid { outline: var(--border-md) solid var(--error); outline-offset: -2px; }
.price-section .err { margin-top: calc(var(--sp-xl) * -1); }

/* Spark Tabs (Figma One-Click 8494:22898) : onglet actif Support + bordure basse 2 px, inactif On Surface + bordure Outline 1 px */
.tabs { display: flex; align-items: stretch; background: var(--background); margin-bottom: var(--sp-lg); }
.tab { flex: 1 0 0; min-width: 1px; display: flex; align-items: center; justify-content: center; padding: var(--sp-md) var(--sp-lg);
  font-size: 14px; line-height: 20px; font-weight: 400; color: var(--on-surface); border-bottom: var(--border-sm) solid var(--outline); cursor: pointer;
  transition: color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard); }
.tab:hover { background: var(--surface-hover); }
.tab[aria-selected="true"] { font-weight: 700; color: var(--support); border-bottom: var(--border-md) solid var(--support); }

/* Onglet « Je donne » (Figma One-Click 8495:23006) */
.give-section { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-md); padding: var(--sp-xl) 0; border-radius: var(--rounded-lg); background: var(--neutral-container); overflow: hidden; }
.give-illus { position: relative; width: 70px; height: 80px; flex: none; }
.give-illus > img { position: absolute; display: block; max-width: none; }
.gi-fauteuil { position: absolute; display: flex; align-items: center; justify-content: center; }
.gi-rot { flex: none; display: flex; flex-direction: column; width: 16.478px; height: 12.822px; transform: rotate(-100.32deg) skewX(.11deg); }
.gi-rot img { width: 24.309px; height: 19.008px; max-width: none; flex: none; }
.give-text { width: 100%; padding: 0 var(--sp-xl); text-align: center; color: var(--on-surface); min-height: 48px; display: flex; align-items: center; justify-content: center; }

/* Articles similaires vendus : scroll horizontal, photos 120 px, état + délai de vente */
.soldscroll { display: flex; gap: var(--sp-md); overflow-x: auto; margin: 0 calc(var(--sp-lg) * -1); padding: 0 var(--sp-lg) var(--sp-sm); scroll-snap-type: x mandatory; scrollbar-width: none; }
.soldscroll::-webkit-scrollbar { display: none; }
.soldscroll article { flex: 0 0 120px; scroll-snap-align: start; }
.soldscroll .ph { width: 120px; height: 120px; border-radius: var(--rounded-md); overflow: hidden; background: var(--neutral-container); }
.soldscroll .ph img { width: 100%; height: 100%; object-fit: cover; }
.soldscroll { scroll-padding-left: var(--sp-lg); }

/* Bottom sheet prix : titre « Recommandation de prix » + lien « En savoir plus » */
.reco-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md); margin-top: var(--sp-xl); }
.reco-head h3 { margin: 0; }

/* Livraison (rendu prod) : cartes En livraison / En main propre */

.ship-card { border: var(--border-sm) solid var(--outline); border-radius: var(--rounded-lg); overflow: hidden; background: var(--surface); }

.logo svg { width: 24px; height: 24px; }
.edit-btn { width: 48px; height: 48px; background: var(--support-container); color: var(--on-support-container); }
.edit-btn:hover { background: var(--blueberry-200); }
.edit-btn.white { background: var(--surface); }
.edit-btn.white:hover { background: var(--surface-hover); }
.sc-parcel { display: flex; align-items: center; gap: var(--sp-lg); padding: var(--sp-lg); background: var(--support-container); color: var(--on-support-container); }
.sc-parcel .ic { color: var(--neutral); stroke-width: 1.6; }
.sc-parcel .sc-sub { color: var(--support-hover); }
.sc-parcel .grow { flex: 1; }
/* Bottom sheet format du colis */
.sub-bd { padding-top: 0; }
.fmt-list { display: flex; flex-direction: column; gap: var(--sp-lg); }
.fmt { display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-lg); border: var(--border-sm) solid var(--outline); border-radius: var(--rounded-lg); text-align: left; background: var(--surface); }
.fmt:hover { background: var(--surface-hover); }

.fmt .radio { border-color: var(--outline); }
.fmt[aria-checked="true"] { border: var(--border-md) solid var(--support); padding: 15px; }

.fmt-info { display: flex; align-items: center; gap: var(--sp-lg); margin-top: var(--sp-xl); padding: var(--sp-xl) var(--sp-xl); border-radius: var(--rounded-lg); background: var(--neutral-container); color: var(--on-surface); }
.fmt-info p { flex: 1; }

/* Bottom sheet transporteurs */
.carrier { display: flex; align-items: flex-start; gap: var(--sp-lg); width: 100%; padding: var(--sp-lg) 0; text-align: left; }
.carrier .grow { display: flex; flex-direction: column; gap: var(--sp-md); flex: 1; }

/* Tab « Créer une annonce » */

.adchip .add-ic { width: 32px; height: 32px; border-radius: var(--rounded-full); background: var(--support-container); display: grid; place-items: center; color: var(--support); }

/* Illustration au-dessus du titre du bottom sheet champ libre (130 px, centrée) ; version dark prête pour un thème sombre */

/* Carte « Dites-nous tout… » du One form (Figma One-Click 8504:44044) */
.magic-card { display: flex; align-items: center; justify-content: center; gap: var(--sp-lg); width: 100%; padding: 0 var(--sp-lg) 0 0; border-radius: var(--rounded-lg); background: var(--neutral-container); overflow: hidden; text-align: left; cursor: pointer; transition: background var(--dur-fast) var(--ease-standard); }
.magic-card:hover { background: var(--nightshade-200); }
.mc-illus { position: relative; width: 86px; height: 94px; flex: none; }
.mc-illus img { position: absolute; left: 0; bottom: 0; width: 85.647px; height: 80px; max-width: none; display: block; }
.mc-text { flex: 1 0 0; min-width: 1px; color: var(--on-surface); }
.mc-chev { display: flex; align-items: center; justify-content: center; flex: none; }
.mc-chev img { width: 16px; height: 16px; transform: rotate(180deg); display: block; }

/* Carte « Dites-nous tout… » : reflet lumineux qui balaie de gauche à droite, 1 fois toutes les 5 s */
.magic-card { position: relative; isolation: isolate; }
.magic-card::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none; z-index: 1;
  background: linear-gradient(105deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, .55) 50%, rgba(255, 255, 255, 0) 100%);
  transform: translateX(-120%) skewX(-12deg); animation: card-shine 5s var(--ease-standard) infinite; }
/* balayage de 2 s (40 % d'un cycle de 5 s), puis repos */
@keyframes card-shine { 0% { transform: translateX(-120%) skewX(-12deg); } 40%, 100% { transform: translateX(260%) skewX(-12deg); } }
@media (prefers-reduced-motion: reduce) { .magic-card::after { animation: none; display: none; } }

/* Dictée vocale : apparition des mots façon « Writing Text » (chaque mot monte de 0,35 em en 800 ms) */
.magic { position: relative; }
.magic-live { display: none; position: absolute; inset: 0; padding: var(--sp-lg); overflow-y: auto; color: var(--on-surface); white-space: pre-wrap; pointer-events: none; }
.magic-live.on { display: block; }
.magic textarea.ghost { color: transparent; caret-color: transparent; }
.magic textarea.ghost::placeholder { color: transparent; }
.ww { display: inline-block; animation: writing-word 800ms var(--ease-decelerate) both; }
@keyframes writing-word { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ww { animation: none; } }

/* Blurry reveal (Text Generate Effect) : opacité d'abord, netteté ensuite ; aucun déplacement */
span.tg { display: inline; white-space: pre-wrap; }
.tg { animation: tg-reveal 600ms var(--ease-standard) both; }
@keyframes tg-reveal { 0% { opacity: 0; filter: blur(8px); } 40% { opacity: 1; filter: blur(4px); } 100% { opacity: 1; filter: blur(0); } }
@media (prefers-reduced-motion: reduce) { .tg { animation: none; } }

/* Bloc « Annonce générée » (Figma One-Click 8506:44203) : même carte que « Dites-nous tout… », sans reflet, lien Neutral */

.magic-card.done:hover { background: var(--neutral-container); }
.magic-card.done::after { display: none; }
.mc-done { flex: 1 0 0; min-width: 1px; display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-md); color: var(--on-surface); }
.mc-link { color: var(--neutral); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.mc-link:hover { color: var(--on-surface); }

/* Texte d'aide hors Form Field (ex. « Livraison payée par ») : même style Caption atténué */
p.helper { font-size: 12px; line-height: 16px; color: var(--text-dim); }

/* Section Livraison du One form (Figma One-Click 8507:44299) */
.deliv-section { display: flex; flex-direction: column; gap: 20px; }
.deliv-section h2 { margin: 0; }
.deliv-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; color: var(--on-surface); cursor: pointer; border-radius: var(--rounded-md); }
.deliv-row:hover .dr-info > .t-body1h { text-decoration: underline; text-underline-offset: 2px; }
.dr-info { flex: 1 0 0; min-width: 1px; display: flex; flex-direction: column; }
.dr-means { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; row-gap: 4px; }
.dr-dot { font-size: 10px; line-height: 14px; }

/* Écran de confirmation (rendu prod) */
.scroll.confirm { padding-top: var(--sp-4xl); display: flex; flex-direction: column; gap: var(--sp-lg); }
.confirm-illus { display: flex; justify-content: center; margin-bottom: var(--sp-md); }
.confirm-illus img { width: 144px; height: auto; display: block; }
.confirm .ai-card { margin-top: var(--sp-md); }
.confirm-ft { flex: none; padding: var(--sp-lg) var(--sp-lg) var(--sp-2xl); display: flex; flex-direction: column; gap: var(--sp-lg); background: var(--surface); }

/* Toast : ne bloque jamais les clics et se place au-dessus des CTA de la confirmation */
.toast { pointer-events: none; }
.phone:has(.confirm-ft) .toast { bottom: 184px; }

/* Cartes verticales (Figma One-Click 8512:45393) : fond blanc, rayon 8, padding 10, illustration 60 x 50, label Body 2 Highlight */
.verticals { align-items: stretch; }
.vcard { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: var(--sp-md); min-height: 0; padding: 10px;
  border-radius: var(--rounded-md); background: var(--background); border: var(--border-sm) solid var(--nightshade-300); text-align: left; }
.vcard[aria-checked="true"] { padding: 9px; border: var(--border-md) solid var(--support); background: var(--background); }
.vcard:hover { background: var(--surface-hover); }
.vc-illu { position: relative; width: 60px; height: 50px; flex: none; }
.vc-clip { position: absolute; left: calc(50% - .41px); top: calc(50% + .5px); width: 59.175px; height: 51px; transform: translate(-50%, -50%); overflow: hidden; }
/* Le masque Figma est un simple rectangle 59.175 x 51 : le overflow:hidden de .vc-clip fait le même découpage.
   Un mask-image externe est bloqué quand le prototype est ouvert en file:// (l'illustration disparaissait). */
.vc-mask { position: absolute; inset: .04% .04% .32% .21%; }
.vc-mask img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; display: block; }
.vc-label { width: 100%; color: var(--on-surface); }

/* Galerie : le haut de page reste épinglé et s'efface, la galerie (fond gris, coins hauts 16 px) glisse par-dessus */
.g-screen { --p: 0; --bar: 0; }
.g-bar { position: relative; z-index: 3; margin-top: 0; padding-top: var(--sp-xl); height: 80px; }
.g-bar::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--neutral-container); opacity: var(--bar); pointer-events: none; }
.g-bar-title { opacity: var(--bar); }
.g-scroll { overscroll-behavior: contain; scrollbar-width: none; }
.g-scroll::-webkit-scrollbar { display: none; }
.g-hero { position: sticky; top: 0; z-index: 1; padding: var(--sp-sm) var(--sp-lg) var(--sp-xl);
  opacity: calc(1 - var(--p) * 1.3); transform: translateY(calc(var(--p) * -24px)) scale(calc(1 - var(--p) * .05)); transform-origin: top center; will-change: opacity, transform; }
.g-hero.is-covered { visibility: hidden; pointer-events: none; }
.g-panel { position: relative; z-index: 2; min-height: 100%; background: var(--neutral-container); border-radius: var(--rounded-lg) var(--rounded-lg) 0 0;
  padding: var(--sp-lg) var(--sp-lg) 120px; box-shadow: 0 -8px 24px rgba(32, 39, 48, .06); }
.g-panel-title { margin-bottom: var(--sp-md); }
.g-panel .tile.cam { background: var(--surface); }
@media (prefers-reduced-motion: reduce) { .g-hero { transform: none; } }

/* Confirmation (Figma One-Click 1992:18561) */
.t-display3 { font-size: 24px; line-height: 32px; font-weight: 700; }
.cf-close { position: absolute; top: var(--sp-xl); right: 0; z-index: 3; width: 56px; height: 56px; }
.cf-close img { width: 24px; height: 24px; }
.scroll.cf { padding: var(--sp-4xl) var(--sp-lg) var(--sp-lg); display: flex; flex-direction: column; gap: var(--sp-2xl); }
.cf-cards { position: relative; display: flex; justify-content: center; padding: 0 var(--sp-lg); }
.cf-card { width: 228px; flex: none; display: flex; flex-direction: column; gap: var(--sp-lg); padding: var(--sp-lg); border-radius: var(--rounded-lg); background: var(--surface);
  box-shadow: 0 8px 16px 0 var(--shadow); }
.cf-ph { position: relative; height: 196px; border-radius: 12px; overflow: hidden; background: rgba(21, 34, 51, .08); }
.cf-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cf-info { display: flex; flex-direction: column; color: var(--on-surface); }
.cf-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cf-text { display: flex; flex-direction: column; gap: var(--sp-sm); padding: 0 var(--sp-md); text-align: center; }
.cf-rating { display: flex; flex-direction: column; align-items: center; gap: var(--sp-md); padding: var(--sp-lg); border-radius: var(--rounded-lg); background: var(--neutral-container); text-align: center; }
.cf-stars { display: flex; gap: var(--sp-md); }
.cf-star { width: 40px; height: 40px; border-radius: var(--rounded-md); }
.cf-star img { width: 40px; height: 40px; display: block; transition: transform var(--dur-fast) var(--ease-standard); }
.cf-star:hover img { transform: scale(1.08); }
.cf .ai-card { margin-top: calc(var(--sp-lg) * -1); }
/* Multi : éventail de 2 ou 3 cartes, la première devant au centre, les autres derrière à gauche et à droite */
.cf-cards.fan { height: 360px; padding: 0; }
.cf-cards.fan .cf-card { position: absolute; top: 8px; left: 50%; transform-origin: 50% 100%; transition: transform var(--dur-slow) var(--ease-decelerate);
  animation: fan-in var(--dur-slow) var(--ease-decelerate) both; }
.cf-cards.fan .cf-card:nth-child(1) { z-index: 3; transform: translateX(-50%); }
.cf-cards.fan .cf-card:nth-child(2) { z-index: 2; transform: translateX(-50%) translateX(64px) rotate(9deg) scale(.88); animation-delay: 80ms; }
.cf-cards.fan .cf-card:nth-child(3) { z-index: 1; transform: translateX(-50%) translateX(-64px) rotate(-9deg) scale(.88); animation-delay: 160ms; }
.cf-cards.fan.n2 .cf-card:nth-child(1) { transform: translateX(-50%) translateX(-20px) rotate(-3deg); }
.cf-cards.fan.n2 .cf-card:nth-child(2) { transform: translateX(-50%) translateX(44px) rotate(8deg) scale(.9); }
.cf-cards.fan .cf-card:not(:first-child) .cf-info { opacity: .6; }
@keyframes fan-in { from { opacity: 0; translate: 0 16px; } to { opacity: 1; translate: 0 0; } }
@media (prefers-reduced-motion: reduce) { .cf-cards.fan .cf-card { animation: none; } }

/* Correctifs éventail : hauteur réservée (pas d'écrasement en flex) et cartes arrière resserrées */
.scroll.cf > * { flex: none; }
.cf-cards.fan { height: 372px; }
.cf-cards.fan .cf-card:nth-child(2) { transform: translateX(-50%) translateX(56px) rotate(8deg) scale(.86); }
.cf-cards.fan .cf-card:nth-child(3) { transform: translateX(-50%) translateX(-56px) rotate(-8deg) scale(.86); }
.cf-cards.fan { height: 316px; }

/* Chips des caractéristiques pré-remplies : Spark Chip Large, Tinted, Support, Enabled (Figma 29436:14197) */
.spark-chip.lg.tinted-support { height: 44px; padding: 6px 12px; background: var(--support-container); color: var(--on-support-container); cursor: pointer; }
.spark-chip.lg.tinted-support:hover { background: var(--blueberry-200); }
.spark-chip.lg.tinted-support:active { background: var(--blueberry-200); transform: scale(.98); }
.spark-chip.lg.tinted-support .ic { color: var(--on-support-container); }

/* ---------- Écran de génération ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.center.gen { gap: var(--sp-xl); }
.gen-title { text-align: center; }
/* Flip words : le mot sortant monte, grossit et se floute ; le suivant monte lettre par lettre (40 ms d'écart) */
.fw { position: relative; display: inline-grid; vertical-align: bottom; color: var(--main); }
.fw > * { grid-area: 1 / 1; }
.fw-sizer { visibility: hidden; white-space: nowrap; }
.fw-word { white-space: nowrap; text-align: center; }
.fw-word.in .fw-l { display: inline-block; animation: fw-in 420ms var(--ease-decelerate) both; animation-delay: var(--d); }
.fw-word.out { animation: fw-out 420ms var(--ease-accelerate) both; }
@keyframes fw-in { from { opacity: 0; transform: translateY(.6em); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes fw-out { to { opacity: 0; transform: translate(.4em, -.5em) scale(1.15); filter: blur(6px); } }
/* Checklist : coches qui se dessinent une à une, étape en cours qui « shimmer » */
.gen-steps { gap: var(--sp-lg); }
.gen-steps li { color: var(--text-dim); transition: color var(--dur) var(--ease-standard); }
.st-check { width: 24px; height: 24px; flex: none; border-radius: var(--rounded-full); border: var(--border-md) solid var(--nightshade-300); display: grid; place-items: center;
  transition: background var(--dur) var(--ease-standard), border-color var(--dur) var(--ease-standard), transform var(--dur) var(--ease-standard); }
.st-check svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; }
.gen-steps li.active .st-check { border-color: var(--support); animation: st-pulse 1.2s var(--ease-standard) infinite; }
@keyframes st-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(9, 65, 113, .25); } 50% { box-shadow: 0 0 0 5px rgba(9, 65, 113, 0); } }
.gen-steps li.done { color: var(--on-surface); }
.gen-steps li.done .st-check { background: var(--success); border-color: var(--success); animation: st-pop 320ms var(--ease-decelerate); }
.gen-steps li.done .st-check svg { animation: st-draw 320ms 120ms var(--ease-decelerate) forwards; }
@keyframes st-pop { 0% { transform: scale(.7); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes st-draw { to { stroke-dashoffset: 0; } }
/* Shimmering text : base Neutral atténué, lumière On Surface ; un passage (~1,2 s) puis une pause, 2 s au total */
.sh-c { display: inline; color: inherit; }
.gen-steps li.active .sh-c { color: var(--nightshade-400); animation: sh 2000ms linear infinite; animation-delay: calc(var(--k) * 1200ms); }
@keyframes sh { 0% { color: var(--nightshade-400); } 12% { color: var(--on-surface); } 24%, 100% { color: var(--nightshade-400); } }
@media (prefers-reduced-motion: reduce) {
  .gen-steps li.active .sh-c { animation: none; color: var(--text-dim); }
  .fw-word.in .fw-l, .fw-word.out { animation: none; } .fw-word.out { display: none; }
}

/* Ajustements : mot animé sur sa propre ligne (pas de vide à droite de « On prépare »), checklist contenue */
.gen-steps { width: 100%; max-width: 300px; }
.gen-steps li { align-items: flex-start; }
.gen-steps .st-label { padding-top: 2px; min-width: 0; }

/* Titre de génération : couleur et ligne d'origine, apparition lettre par lettre (flip words) */
.gen-title .fw-word { white-space: normal; }

/* Illustrations verticales fournies (53 x 46) : proportions conservées dans le cadre 59 x 51 */
.vc-mask img { object-fit: contain; }

/* v4 : galerie en bottom sheet */
.sheet.picker { height: 86%; }
.sheet.picker .bd { flex: 1; min-height: 0; }
.sheet.picker .ft .btn:disabled { opacity: .4; }

/* v5 : chips verticales en haut du One form + chip de l'annonce en cours */
.vchips { display: flex; gap: var(--sp-md); padding: var(--sp-sm) var(--sp-lg) 0; flex: none; }
.adchip .thumb:empty { background: var(--neutral-container); border: var(--border-sm) dashed var(--outline); }

/* v6 : galerie plus basse à l'ouverture, extensible */
.sheet.picker { height: 56%; transition: transform var(--dur) var(--ease-decelerate), height var(--dur) var(--ease-standard); }
.sheet.picker.tall { height: 86%; }
.sheet.picker .grab { position: relative; cursor: pointer; }
.sheet.picker .grab::before { content: ""; position: absolute; inset: -12px -40px; }

/* v8 : remplissage IA dans le One form */
@keyframes ai-shimmer { to { background-position: -200% 0; } }
.ai-wait { color: transparent !important; border-color: transparent !important; box-shadow: none !important; pointer-events: none;
  background: linear-gradient(100deg, var(--neutral-container) 30%, var(--accent-container) 50%, var(--neutral-container) 70%) 0 0 / 200% 100% !important; animation: ai-shimmer 1.2s linear infinite; }
.ai-wait::placeholder { color: transparent; }
.ai-wait > *, .ai-wait .ic { visibility: hidden; }
.pc-value.ai-wait { display: inline-block; min-width: 112px; border-radius: var(--rounded-md); }
.ai-write { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-container), 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent) !important; outline: none; transition: box-shadow var(--dur) var(--ease-standard); }
.ai-pop { animation: ai-pop 750ms var(--ease-decelerate) both; }
@keyframes ai-pop {
  0% { opacity: 0; transform: scale(.6); filter: blur(6px); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
  50% { opacity: 1; transform: scale(1.08); filter: blur(0); box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 24px color-mix(in srgb, var(--accent) 40%, transparent); }
  100% { opacity: 1; transform: none; filter: none; box-shadow: 0 0 0 0 transparent; } }
.filling .sticky { pointer-events: none; opacity: .5; }
@media (prefers-reduced-motion: reduce) { .ai-wait { animation: none; } .ai-pop { animation: none; } }

/* v9 : champ magique minimal */
.magic-example { margin-top: calc(var(--sp-md) * -1); }

/* v10 : champ magique plus petit, sans ligne d'exemple */
.sheet .magic textarea { min-height: 96px; }
.sheet .bd > .magic-field { gap: var(--sp-lg); }

/* v11 : One form vide minimal (photos, titre, description, catégorie, prix) */
.cat-input { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md); text-align: left; cursor: pointer; color: var(--on-surface); }
.cat-input.empty { color: var(--text-dim); }
.ai-hold { opacity: 0; }
.ai-rise { animation: ai-rise 700ms var(--ease-decelerate) both; }
@keyframes ai-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ai-rise { animation: none; } }

/* v12 : micro dans le champ, en bas à droite */
.magic .voice { position: absolute; right: var(--sp-md); bottom: var(--sp-md); display: block; }
.magic .voice .wave { display: none; }
.magic .ibtn.mic { width: 40px; height: 40px; }
.magic .ibtn.mic .ic { width: 20px; height: 20px; }
.sheet .magic textarea, .magic-live { padding-bottom: 64px; }

/* v15 : annonce de nouveauté (wahou) dans la galerie */
.novelty { position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: center; gap: var(--sp-lg); margin-bottom: var(--sp-lg); padding: var(--sp-lg);
  border-radius: var(--rounded-lg); color: #fff; background: linear-gradient(115deg, var(--accent) 0%, var(--main) 100%); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent); }
.novelty::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; z-index: -1; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent); animation: nv-shine 3.2s var(--ease-standard) infinite; }
@keyframes nv-shine { 0% { transform: translateX(-120%) skewX(-12deg); } 45%, 100% { transform: translateX(300%) skewX(-12deg); } }
.nv-ic { flex: none; width: 40px; height: 40px; border-radius: var(--rounded-full); background: rgba(255, 255, 255, .22); display: grid; place-items: center; animation: nv-pulse 2s ease-in-out infinite; }
.nv-ic .ic { width: 24px; height: 24px; stroke: #fff; fill: rgba(255, 255, 255, .35); }
@keyframes nv-pulse { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.12) rotate(8deg); } }
.nv-tag { display: inline-block; padding: 0 var(--sp-sm); border-radius: var(--rounded-sm); background: #fff; color: var(--on-accent-container); text-transform: uppercase; letter-spacing: .04em; font-size: 12px; line-height: 20px; vertical-align: 1px; }
@media (prefers-reduced-motion: reduce) { .novelty::after, .nv-ic { animation: none; } }

/* v16 : remplissage sobre (fondu, sans halo ni flou ni pop) */
@keyframes ai-fade { from { opacity: 0; } to { opacity: 1; } }
.ai-wait { background: linear-gradient(100deg, var(--neutral-container) 30%, var(--nightshade-200) 50%, var(--neutral-container) 70%) 0 0 / 200% 100% !important; animation: ai-shimmer 1.8s linear infinite; }
.ai-write { border-color: var(--outline) !important; box-shadow: none !important; }
.ai-pop, .ai-rise { animation: ai-fade 300ms ease-out both; }

/* v19 : espacements resserrés partout */
.navbar { margin-top: var(--sp-lg); height: 48px; }
.scroll { padding-bottom: var(--sp-lg); }
.scroll.nopad { padding-bottom: var(--sp-lg); }
.section { margin-top: var(--sp-lg); }
.section > h2 { margin-bottom: var(--sp-md); }
.section > h3 { margin: var(--sp-lg) 0 var(--sp-md); }
.field + .field { margin-top: var(--sp-lg); }
.sec-div { margin: var(--sp-lg) calc(var(--sp-lg) * -1) 0; height: 4px; }
.sec-div + .section { margin-top: var(--sp-lg); }
.adstrip { padding: var(--sp-sm) var(--sp-lg); }
.sticky { padding: var(--sp-md) var(--sp-lg); }
.deliv-section { gap: var(--sp-md); }
.sheet .hd { padding: var(--sp-md) var(--sp-lg); }
.sheet .bd { padding-bottom: var(--sp-md); }
.sheet .ft { padding: var(--sp-md) var(--sp-lg); }
.sheet .bd > .magic-field { margin-top: var(--sp-md); gap: var(--sp-md); }
.novelty { margin-bottom: var(--sp-md); }
.scroll.confirm { padding-top: var(--sp-2xl); gap: var(--sp-md); }
.scroll.cf { padding-top: var(--sp-2xl); gap: var(--sp-xl); }
.card.int { gap: var(--sp-md); }
.thumbs { padding: 0; }

/* v21 : caractéristiques renseignées = chips neutres */
.spark-chip.lg.tinted-neutral { height: 44px; padding: 6px 12px; background: var(--neutral-container); color: var(--on-surface); border: var(--border-sm) solid var(--outline); cursor: pointer; }
.spark-chip.lg.tinted-neutral:hover, .spark-chip.lg.tinted-neutral:active { background: var(--nightshade-200); }
.spark-chip.lg.tinted-neutral:active { transform: scale(.98); }
.spark-chip.lg.tinted-neutral .ic { color: var(--on-surface); }

/* v22 : confirmation, info IA avec lien profil */
.ai-card p .ic { display: inline-block; vertical-align: -3px; margin-right: var(--sp-sm); }
.ai-card .textlink { display: inline; }

/* v24 : encart Nouveau réduit */
.novelty { gap: var(--sp-md); margin-bottom: var(--sp-md); padding: var(--sp-md) var(--sp-lg) var(--sp-md) var(--sp-md); border-radius: var(--rounded-md); box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent); }
.nv-ic { width: 28px; height: 28px; }
.nv-ic .ic { width: 16px; height: 16px; }
.novelty p { font-size: 13px; line-height: 18px; }
.nv-tag { font-size: 10px; line-height: 16px; padding: 0 var(--sp-sm); }

/* v25 : bottom sheet catégorie */
.sheet.catpick .verticals { margin-bottom: var(--sp-md); }

/* v26 : validation de la verticale par un check vert sur la carte sélectionnée */
.vwrap { position: relative; display: flex; }
.vwrap .vcard { width: 100%; }
.vcheck { position: absolute; right: var(--sp-md); bottom: var(--sp-md); width: 32px; height: 32px; border-radius: var(--rounded-full); background: var(--success); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }
.vcheck .ic { width: 20px; height: 20px; stroke: #fff; }
.vcheck:hover { filter: brightness(.92); }
.vcheck:active { transform: scale(.94); }
.sheet.catpick .verticals { margin-bottom: 0; }

/* v27 : vue Toutes sans onglets, bouton Ajouter en pied de liste */
.adchip.add.wide { width: 100%; justify-content: center; }

/* v28 : annonces non vérifiées signalées quand on tente de publier */
.card.int.flag { border: var(--border-md) solid var(--error); animation: flag-shake 400ms var(--ease-standard); }
@keyframes flag-shake { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .card.int.flag { animation: none; } }

/* v29 : caractéristiques obligatoires */
.row.invalid { box-shadow: inset 0 0 0 2px var(--error); }
.row.invalid .v, .row.invalid .t-body1 { color: var(--error); font-weight: 700; }

/* v31 : suppression d'une annonce en multi-dépôt */
.cardwrap { position: relative; }
.cardwrap .card.int { padding-right: 56px; }
.card-del { position: absolute; top: 50%; right: var(--sp-md); transform: translateY(-50%); width: 40px; height: 40px; border-radius: var(--rounded-full); display: grid; place-items: center; color: var(--neutral); }
.card-del:hover { background: var(--nightshade-200); }
.card-del .ic { width: 20px; height: 20px; }
.btn.danger { background: var(--error); color: #fff; }
.btn.danger:hover { filter: brightness(.92); }

/* v32 : présélection à confirmer (check qui pulse + consigne) */
.vcheck { animation: vcheck-pulse 1.6s ease-out infinite; }
@keyframes vcheck-pulse { 0% { box-shadow: 0 2px 6px rgba(0, 0, 0, .2), 0 0 0 0 color-mix(in srgb, var(--success) 55%, transparent); } 70%, 100% { box-shadow: 0 2px 6px rgba(0, 0, 0, .2), 0 0 0 12px color-mix(in srgb, var(--success) 0%, transparent); } }
.sheet.catpick .verticals { margin-bottom: var(--sp-md); }
.cat-hint { display: flex; align-items: center; gap: var(--sp-md); padding: var(--sp-md) var(--sp-lg); border-radius: var(--rounded-md); background: var(--success-container); color: var(--on-success-container, var(--on-surface)); }
.cat-hint .ic { flex: none; width: 20px; height: 20px; stroke: var(--success); }
@media (prefers-reduced-motion: reduce) { .vcheck { animation: none; } }
/* v32 : le check ne recouvre plus le libellé (place réservée en bas des cartes) */
.vwrap .vcard { padding-bottom: 40px; }
.vwrap .vcard[aria-checked="true"] { padding-bottom: 39px; }
.vcheck { right: var(--sp-sm); bottom: var(--sp-sm); }

/* v33 : bouton Publier de la tab bar de la même couleur que les autres onglets */
.tabbar button.publish:not([aria-current="page"]) { color: var(--text-dim); font-weight: 400; }

/* v34 : check de confirmation plus petit, sans bandeau de consigne */
.vcheck { width: 24px; height: 24px; right: var(--sp-sm); bottom: var(--sp-sm); }
.vcheck .ic { width: 14px; height: 14px; }
@keyframes vcheck-pulse { 0% { box-shadow: 0 2px 6px rgba(0, 0, 0, .2), 0 0 0 0 color-mix(in srgb, var(--success) 55%, transparent); } 70%, 100% { box-shadow: 0 2px 6px rgba(0, 0, 0, .2), 0 0 0 8px color-mix(in srgb, var(--success) 0%, transparent); } }
.vwrap .vcard { padding-bottom: 32px; }
.vwrap .vcard[aria-checked="true"] { padding-bottom: 31px; }
.sheet.catpick .verticals { margin-bottom: 0; }

/* v35 : immobilier / véhicule, champ immatriculation, clavier simulé */
.input.plate { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.kbd { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; height: 232px; padding: var(--sp-md) var(--sp-sm) var(--sp-lg); background: #d4d7dd; display: flex; flex-direction: column; gap: var(--sp-md);
  transform: translateY(100%); transition: transform var(--dur) var(--ease-decelerate); pointer-events: none; }
.kbd.on { transform: none; }
.kbd .kr { display: flex; justify-content: center; gap: 6px; flex: 1; }
.kbd .k { flex: 1; max-width: 32px; display: grid; place-items: center; border-radius: 6px; background: #fff; color: var(--on-surface); font-weight: 400; font-size: 18px; box-shadow: 0 1px 0 rgba(0, 0, 0, .3); }
.kbd .k.w { flex: 1.4; max-width: 48px; background: #aeb3bd; font-size: 14px; }
.kbd .k.sp { flex: 5; max-width: none; font-size: 14px; }
.kbd .k.ok { background: var(--main); color: #fff; font-weight: 700; flex: 2; max-width: 80px; }
.phone.kbd-on .screen { bottom: 232px; }
.phone.kbd-on .toast { bottom: 248px; }
@media (pointer: coarse) { .kbd:not([data-force]) { display: none; } }

/* v37 : correctif « clavier visible dès Publier » sur desktop.
   Le focus d'un bouton de la sheet (encore hors cadre) faisait défiler le .phone (overflow: hidden) de 232 px et révélait le clavier simulé rangé sous l'écran. */
.phone { overflow: clip; }
.kbd { visibility: hidden; transition: transform var(--dur) var(--ease-decelerate), visibility 0s linear var(--dur); }
.kbd.on { visibility: visible; transition-delay: 0s; }

/* Version de partage : uniquement la partie mobile (ni cadre de téléphone, ni panneau latéral) */
html, body { height: 100%; }
body { display: flex; justify-content: center; align-items: stretch; padding: 0; gap: 0; background: var(--nightshade-100); }
.phone { width: min(100vw, 430px); height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
</style>

    return `<div class="section" style="margin-top:${top}px"><h2 class="t-subhead" style="margin-bottom:8px">Photos <span class="dim t-body2" style="font-weight:400">· ${a.photos.length}</span></h2>

  // Effets inspirés de shadcn « Flip Words » (apparition du titre lettre par lettre) et « Shimmering Text »

  const letters = (w) => [...w].map((ch, i) => `<span class="fw-l" style="--d:${i * 40}ms">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join('');
  const shimmer = (t) => { const n = t.length; return `<span class="sr-only">${esc(t)}</span><span aria-hidden="true">${[...t].map((ch, i) => (ch === ' ' ? ' ' : `<span class="sh-c" style="--k:${(i / n).toFixed(3)}">${esc(ch)}</span>`)).join('')}</span>`; };
  function loading() {
    const steps = ['Analyse de vos photos', 'Lecture de votre description', 'Rédaction de l\'annonce et estimation du prix'];
    const title = multi() && S.active === null ? 'On prépare vos annonces' : 'On prépare votre annonce';
    return `<div class="center gen" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>

  }
  function runLoadingFx() {
    const lis = [...app.querySelectorAll('#steps li')];
    lis.forEach((l, i) => setTimeout(() => { l.classList.remove('active'); l.classList.add('done'); lis[i + 1]?.classList.add('active'); }, 600 + i * 650));
  }


  function paramRows(a) {
    const chip = (cls) => (p) => `<button class="spark-chip lg ${cls}" data-a="editParam" data-key="${p.key}" data-id="${a.id}" id="p-${a.id}-${p.key}" aria-label="Modifier ${esc(p.label)} : ${esc(p.value)}"><span class="spark-chip-content">${esc(p.label)} : ${esc(p.value)}</span>${ic('edit', 'sm')}</button>`;
    const row = (p) => { const bad = a.tried && p.essential && !p.value;
      return `<button class="row${bad ? ' invalid' : ''}" data-a="editParam" data-key="${p.key}" data-id="${a.id}" id="p-${a.id}-${p.key}"><div class="k"><div class="t-caption dim">${p.label}${p.essential ? ' *' : ''}</div>
        <div class="${p.value ? 'v t-body1h' : 't-body1 dim'}">${p.value ? esc(p.value) : bad ? 'Champ obligatoire' : 'À renseigner'}</div></div>${ic('chev-r', 'sm')}</button>`; };
    const shown = a.params.filter((p) => p.key !== 'cat'); // la catégorie a son propre champ
    const ai = shown.filter((p) => p.source === 'ai'), usr = shown.filter((p) => p.source === 'user'), rest = shown.filter((p) => p.source !== 'ai' && p.source !== 'user').sort((x, y) => !!y.essential - !!x.essential);
    return (ai.length ? `<h3 class="t-body2h">Pré-remplies pour vous <span class="dim" style="font-weight:400">à vérifier</span></h3><div class="spark-chips">${ai.map(chip('tinted-support')).join('')}</div>` : '')
      + (usr.length ? `<h3 class="t-body2h">Renseignées par vous</h3><div class="spark-chips">${usr.map(chip('tinted-neutral')).join('')}</div>` : '')
      + (rest.length ? `<h3 class="t-body2h">À compléter</h3><div class="rows">${rest.map(row).join('')}</div>` : '');
  }

  function deliveryBlock() {
    const d = S.delivery, sel = d.addrs.filter((x) => x.sel), cars = CARRIERS.filter((c) => d.carriers[c.id]);
    const means = [d.hand ? 'En main propre' : '', d.ship ? (cars.length ? `En livraison (${cars.length} transporteur${cars.length > 1 ? 's' : ''})` : 'En livraison') : ''].filter(Boolean);
    return `<div class="sec-div" role="separator"></div><div class="section deliv-section"><h2 class="t-headline2">Livraison</h2>
      <button class="deliv-row" id="delivery" data-a="openDelivery" aria-haspopup="dialog">
        <span class="dr-info"><span class="t-body1h">${sel.length ? esc(sel[0].text) : 'Aucune adresse'}${sel.length > 1 ? ` <span class="tag neutral">+${sel.length - 1}</span>` : ''}</span>
          <span class="dr-means t-body2">${means.map((m, i) => `${i ? '<span class="dr-dot" aria-hidden="true">•</span>' : ''}<span>${m}</span>`).join('')}</span>
          ${d.ship ? `<span class="t-body2">Colis ${SIZES.find((x) => x.id === d.size).label}</span>` : ''}</span>
        <span class="mc-chev" aria-hidden="true"><img src="${ASSET(`assets/icons/chevron-vertical.svg`)}" alt="" width="16" height="16"></span></button></div>`;
  }


  /* ---------- Modale Livraison ---------- */

    return `<header class="navbar"><button class="ibtn" data-a="closeSheet" aria-label="Fermer">${ic('back')}</button><h1>Livraison</h1><span class="sp"></span></header>

          <div role="group" aria-label="Adresses">${d.addrs.map((x) => `<button class="opt" role="checkbox" aria-checked="${x.sel}" data-a="dAddr" data-id="${x.id}"><span class="check">${ic('check')}</span><span class="grow t-body1h">${esc(x.text)}</span>${x.def ? '<span class="tag neutral">Par défaut</span>' : ''}</button>`).join('')}</div>
          ${d.errAddr ? '<span class="err" style="display:block">Sélectionnez au moins une adresse</span>' : ''}

            <div style="display:flex;gap:8px;align-items:flex-start"><input class="input" id="newAddr" data-in="newAddr" value="${esc(d.newAddr || '')}" placeholder="ex : 8 avenue Victor Hugo, 69003 Lyon" autocomplete="street-address"><button class="btn outlined sm" data-a="dAddAddr" style="flex:none;min-height:48px">Ajouter</button></div></div></div>

        <div class="section"><div class="ship-card">
          <div class="sc-body">
